# Phase 2 -- Load test (staged step ramp)
#
# Goal: verify the API holds up under a light, realistic concurrent load,
# ramped up gradually rather than all at once, so you can see performance
# at each step (25/50/75/100%) rather than just the end state.
#
# Usage:
#   locust --config configs/phase2_load.conf
#
# What this does:
#   - Loads BOTH locustfile.py (the SubscriptionUser scenario) and
#     locustfile_phase2.py (the staged ramp shape) together -- Locust
#     aggregates User classes and LoadTestShape classes across files, so
#     locustfile.py itself is completely untouched by this phase.
#   - Ramps in 4 steps up to 30 peak VUs: 8 -> 15 -> 23 -> 30, holding 90s
#     at each intermediate step, then holding 30 VUs for 10 minutes (the
#     actual sustained load phase you asked for).
#   - -u/-r/-t are NOT set here on purpose: once a LoadTestShape is
#     present, it fully controls user count and ramp rate over time --
#     any -u/-r/-t values would be ignored anyway.
#   - The shape stops the test automatically once the 10-minute sustained
#     stage ends (confirmed: no need for --run-time as a backstop here).
#   - To change the peak VU count, ramp timing, or sustained duration,
#     edit the constants at the top of locustfile_phase2.py directly --
#     LoadTestShape parameters aren't exposed as config-file keys.

locustfile = locustfile.py,locustfile_phase2.py
headless = true

host = REPLACE_WITH_BASE_URL

csv = results/phase2_load
html = results/phase2_load.html
loglevel = INFO
stop-timeout = 10
