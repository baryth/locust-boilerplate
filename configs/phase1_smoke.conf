# Phase 1 -- Smoke test
#
# Goal: confirm the Locust script works correctly end-to-end with a handful
# of VUs, no logical errors (e.g. trying to activate an already-active
# subscription, or a state mismatch caught by get_subscriptions).
#
# Usage:
#   locust --config configs/phase1_smoke.conf
#
# What this does:
#   - Spawns 5 VUs immediately (small enough to read the console output
#     as it happens).
#   - Stops the whole swarm once ~45 real scenario requests have completed
#     (via the --smoke-iterations flag defined in locustfile.py). Startup
#     auth/topics calls don't count toward this.
#   - 45 was chosen from the task weights (create=2, activate=2, pause=2,
#     get=2, delete=1, total=9): 45 / 9 = 5, so on average every task type
#     -- including the lowest-weight one (delete) -- gets exercised ~5
#     times across the swarm. Bump this up if you want more repetitions,
#     e.g. 90 for ~10 times each.
#   - --run-time is set as a safety net in case something hangs and the
#     iteration target is never reached; the smoke run should finish well
#     before this.
#   - Results are written to results/phase1_smoke.* so Phase 2/3 runs
#     (their own .conf files, once you're ready) don't overwrite this one.

locustfile = locustfile.py
headless = true

host = REPLACE_WITH_BASE_URL

users = 5
spawn-rate = 5
smoke-iterations = 45
run-time = 5m

csv = results/phase1_smoke
loglevel = INFO
stop-timeout = 10
