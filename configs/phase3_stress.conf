# Phase 3 -- Stress test (continuous ramp, auto-stop on degradation)
#
# Goal: find where the API starts to break, by climbing load continuously
# (no holds, unlike Phase 2) until response times clearly degrade, then
# stopping automatically -- rather than running a fixed duration and
# hoping the peak was high enough.
#
# Usage:
#   locust --config configs/phase3_stress.conf
#
# What this does:
#   - Loads locustfile.py (the SubscriptionUser scenario) together with
#     locustfile_phase3.py (the continuous ramp shape + response-time
#     monitor) -- locustfile.py itself is untouched by this phase.
#   - Climbs from 1 to 50 VUs continuously over 10 minutes (no plateaus),
#     then holds at 50 if it hasn't already stopped.
#   - Auto-stops the moment the rolling p95 response time (last 200
#     requests, all endpoints) exceeds 1000ms -- that's your "it broke"
#     signal. A 20-minute hard cap is also set as a safety net in case
#     that threshold is never crossed.
#   - -u/-r/-t are NOT set here on purpose: the LoadTestShape fully
#     controls user count and ramp rate; any -u/-r/-t values would be
#     ignored anyway.
#   - To change peak VUs, ramp duration, or the response-time threshold,
#     edit the constants at the top of locustfile_phase3.py directly --
#     these aren't exposed as config-file keys.

locustfile = locustfile.py,locustfile_phase3.py
headless = true

host = REPLACE_WITH_BASE_URL

csv = results/phase3_stress
html = results/phase3_stress.html
loglevel = INFO
stop-timeout = 10
